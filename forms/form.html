<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Base</title>
</head>
<body>
    <form action="post">
        <label for="username">Enter Your Username:</label>
     <input type="text" id="username" name="username" placeholder="Enter Your Username" required autofocus>
      <label for="Course">Select Your Course:</label>
     <select name="courses">
          <option value="BCA">BCA</option>
          <option value="BBA">BBA</option>
          <option value="BSC-IT">BSC-IT</option>
     </select>
     <div>
        <input type="radio" id="Male" name="Gender" value="Male">
     <label for="Male">Male</label>
        <input type="radio" id="Female" name="Gender" value="Female">
     <label for="Female">Female</label>
     </div>
     <div>
        <input type="checkbox" id="Purchase" name="Purchase" value="Done">
        <label for="Purchase">Purchase Course</label>
     </div><br>
     <div>
        <label for="Review">Give Review..</label>
        <br>
        <textarea name="Review" id="Review" rows="4" cols="50"></textarea>

     </div>
    </form>
</body>
</html>
